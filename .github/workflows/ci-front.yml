# CI del front: pantallas, componentes y build de Next.js.
# Corre en cada PR y en cada push a main. Si el PR no toca el front, el job
# "Front" se saltea (cuenta como aprobado para la protección de main).
name: CI Front

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      front: ${{ steps.diff.outputs.front }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "front=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # El build compila todo src/, así que cualquier cambio ahí lo dispara.
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
            | grep -qE '^(src/|public/|package(-lock)?\.json$|tsconfig\.json$|next\.config\.js$|tailwind\.config\.js$|postcss\.config\.js$|\.eslintrc\.js$|\.github/workflows/ci-front\.yml$)'; then
            echo "front=true" >> "$GITHUB_OUTPUT"
          else
            echo "front=false" >> "$GITHUB_OUTPUT"
          fi

  front:
    name: Front
    needs: cambios
    if: needs.cambios.outputs.front == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Sin secretos: el build no necesita credenciales (se leen en runtime).
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
