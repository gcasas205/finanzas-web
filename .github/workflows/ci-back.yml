# CI del back: rutas API (src/app/api), lógica (src/lib) y tipos.
# Corre en cada PR y en cada push a main. Si el PR no toca el back, el job
# "Back" se saltea (cuenta como aprobado para la protección de main).
name: CI Back

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      back: ${{ steps.diff.outputs.back }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "back=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
            | grep -qE '^(src/lib/|src/app/api/|src/types/|package(-lock)?\.json$|tsconfig\.json$|vitest\.config\.mts$|\.github/workflows/ci-back\.yml$)'; then
            echo "back=true" >> "$GITHUB_OUTPUT"
          else
            echo "back=false" >> "$GITHUB_OUTPUT"
          fi

  back:
    name: Back
    needs: cambios
    if: needs.cambios.outputs.back == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (Vitest)
        run: npm test
